version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: tic-tac-toe-postgres
    environment:
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  nakama:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: tic-tac-toe-nakama
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nakama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: localdb
    ports:
      - "7349:7349"  # HTTP API
      - "7350:7350"  # WebSocket
      - "7351:7351"  # gRPC
    volumes:
      - nakama_data:/nakama/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tic-tac-toe-frontend
    environment:
      VITE_NAKAMA_SERVER_URL: localhost
      VITE_NAKAMA_SERVER_PORT: 7350
      VITE_NAKAMA_USE_SSL: false
    ports:
      - "3000:3000"
    depends_on:
      - nakama
    restart: unless-stopped

volumes:
  postgres_data:
  nakama_data: