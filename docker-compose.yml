version: '3'
services:
  postgres:
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all
    environment:
      - POSTGRES_DB=nakama
      - POSTGRES_PASSWORD=localdb
      - POSTGRES_USER=postgres
    expose:
      - "8080"
      - "5432"
    image: postgres:12.2-alpine
    ports:
      - "5432:5432"
    volumes:
      - data:/var/lib/postgresql/data

  nakama:
    build: ./backend
    depends_on:
      - postgres
    environment:
      - NAKAMA_DATABASE_URL=postgres://postgres:localdb@postgres:5432/nakama?sslmode=disable&max_conns=20&max_idle_conns=4&conn_max_lifetime=60
      - NAKAMA_SOCKET_SERVER_KEY=defaultkey
      - NAKAMA_RUNTIME_PATH=/nakama/data/modules
    expose:
      - "7349"
      - "7350"
      - "7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
    links:
      - "postgres:db"
    ports:
      - "7349:7349"
      - "7350:7350" 
      - "7351:7351"
    restart: unless-stopped
    volumes:
      - ./backend:/nakama/data

volumes:
  data: