name: nakama1
data_dir: "/nakama/data"

logger:
  stdout: true
  level: "INFO"
  file: "/nakama/data/logfile.log"

metrics:
  reporting_freq_sec: 60
  prometheus_port: 9090

session:
  # Set NAKAMA_SESSION_ENCRYPTION_KEY in Railway to a securely generated value,
  # e.g.: openssl rand -hex 32
  encryption_key: "${NAKAMA_SESSION_ENCRYPTION_KEY}"
  token_expiry_sec: 7200
  # Set NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY in Railway to a securely generated value
  refresh_encryption_key: "${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY}"
  refresh_token_expiry_sec: 3600

socket:
  # Set NAKAMA_SERVER_KEY in Railway to a securely generated value
  server_key: "${NAKAMA_SERVER_KEY}"
  port: 7350
  address: "0.0.0.0"
  protocol: "tcp"
  max_message_size_bytes: 4096
  read_timeout_ms: 10000
  write_timeout_ms: 5000
  idle_timeout_ms: 60000
  write_wait_ms: 5000
  pong_wait_ms: 25000
  ping_period_ms: 15000
  ping_backoff_threshold: 20

console:
  # Set NAKAMA_CONSOLE_USERNAME / NAKAMA_CONSOLE_PASSWORD in Railway.
  # Default Nakama console credentials are admin/password — always override these.
  username: "${NAKAMA_CONSOLE_USERNAME}"
  password: "${NAKAMA_CONSOLE_PASSWORD}"

# Database configuration is provided via --database.address in start-railway.sh
# so that POSTGRES_PASSWORD is read from the Railway environment at runtime.

runtime:
  path: "/nakama/build"
  # Set NAKAMA_RUNTIME_HTTP_KEY in Railway to a securely generated value
  http_key: "${NAKAMA_RUNTIME_HTTP_KEY}"