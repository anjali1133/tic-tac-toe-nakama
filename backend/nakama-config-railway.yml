name: nakama1
data_dir: "/nakama/data"

logger:
  stdout: true
  level: "INFO"
  file: "/nakama/data/logfile.log"

metrics:
  reporting_freq_sec: 60
  # Must stay 0 on Railway: $PORT can equal 9090; Prometheus binds :9090 and would
  # collide with the client HTTP API on socket.port (same port → listener fatal).
  prometheus_port: 0

session:
  # encryption_key, refresh_encryption_key, and token_expiry_sec are injected
  # via CLI flags in start-railway.sh from NAKAMA_* environment variables.
  token_expiry_sec: 7200
  refresh_token_expiry_sec: 3600

socket:
  # server_key is injected via CLI flags in start-railway.sh.
  port: 7350
  address: "0.0.0.0"
  protocol: "tcp"
  max_message_size_bytes: 4096
  read_timeout_ms: 10000
  write_timeout_ms: 5000
  idle_timeout_ms: 60000
  write_wait_ms: 5000
  pong_wait_ms: 25000
  ping_period_ms: 15000
  ping_backoff_threshold: 20

console:
  # username and password are injected via CLI flags in start-railway.sh.
  max_message_size_bytes: 4096
  address: "0.0.0.0"

# Client HTTP + WebSocket API: socket.port (overridden by start-railway.sh to Railway $PORT). Console is separate (7351).
runtime:
  path: "/nakama/build"
  # http_key is injected via CLI flags in start-railway.sh.

# Database connection is provided via --database.address in start-railway.sh
# so that POSTGRES_PASSWORD is read from the Railway environment at runtime.
