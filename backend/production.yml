name: tic-tac-toe-nakama-production
data_dir: "./data/"

logger:
  stdout: true
  level: "INFO"
  format: "stackdriver"

metrics:
  reporting_freq_sec: 60

session:
  encryption_key: "defaultencryptionkey"
  token_expiry_sec: 7200
  refresh_encryption_key: "defaultkey"
  refresh_token_expiry_sec: 3600

socket:
  server_key: "defaultkey"
  port: 7350
  max_message_size_bytes: 4096
  read_timeout_ms: 10000
  write_timeout_ms: 10000
  idle_timeout_ms: 60000
  write_wait_ms: 5000
  pong_wait_ms: 25000
  ping_period_ms: 15000
  ping_backoff_threshold: 60

database:
  # This will be set via environment variable NAKAMA_DATABASE_URL
  address: []

runtime:
  env:
    - "production"
  path: "/nakama/data/modules"
  http_key: "defaulthttpkey"
  js_entrypoint: "index.js"

console:
  port: 7351
  username: "admin"
  password: "password"
  signing_key: "defaultkey"

cluster:
  port: 7352
  gossip_bindaddr: "0.0.0.0"
  gossip_bindport: 7352
  rpc_port: 7353