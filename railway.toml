# Railway configuration for monorepo
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile.railway"

[deploy]
# Disable healthcheck for now - Nakama RPC endpoints require authentication
# healthcheckPath = "/v2/rpc/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
