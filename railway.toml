# Railway configuration for monorepo
[build]
builder = "DOCKERFILE"
dockerfilePath = "backend/Dockerfile.railway"

[deploy]
# Built-in Nakama probe (no auth). Wrong paths like /v2/healthcheck fail and cause 502 from the edge.
healthcheckPath = "/healthcheck"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
